<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Three things the data showed</title><desc id="desc">Funding sat at the baseline rate in 57% of hours; it is built from the price premium and scores 0.29 against the premium's 0.29. Binance's all-accounts ratio tracks how many traders are long (0.35); against where the money is (0.03) it is too close to call. Positions near liquidation forecast next week's liquidations (0.47), but last week's liquidations do as well (0.48).</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.fu{animation:fu .9s cubic-bezier(.22,1,.36,1) both}.fi{animation:fi .9s ease-out both}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fi{from{opacity:0}to{opacity:1}}.grow{transform-box:fill-box;animation:grow 1s cubic-bezier(.22,1,.36,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="499" rx="24" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><g class="fu d1"><rect x="36" y="36" width="352" height="420" rx="18" fill="#222221"/><text x="66" y="82" font-size="13" fill="#959390" font-weight="700" letter-spacing="1.8">FUNDING RATES</text><text x="66" y="348" font-size="16" fill="#c3c2b7">Funding is built from the price</text><text x="66" y="372" font-size="16" fill="#c3c2b7">premium, so the two score the same</text><text x="66" y="396" font-size="16" fill="#c3c2b7">(0.29) by design. The premium carries</text><text x="66" y="420" font-size="16" fill="#c3c2b7">the signal without the clamp.</text><text x="64" y="148" font-size="56" fill="#f0efec" font-weight="750" letter-spacing="-1.5">57%</text><text x="66" y="178" font-size="14" fill="#c3c2b7" font-weight="600">of hours pinned at the baseline rate</text><g class="fi d6"><rect x="66.0" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="79.2" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="92.4" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="105.6" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="118.8" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="132.0" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="145.2" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="158.4" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="171.6" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="184.8" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="198.0" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="211.2" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="224.4" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="237.6" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="250.8" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="264.0" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="277.2" y="212.0" width="10.2" height="10.2" rx="2.5" fill="#959390"/><rect x="290.4" y="212.0" width="10