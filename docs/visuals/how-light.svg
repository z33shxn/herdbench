<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">How HerdBench works</title><desc id="desc">Three steps. Everything is public: Hyperliquid shows every account's positions and trades. Rebuild the real crowd: what traders held in 30 markets on 305 days over a year, market makers set aside. Grade the signals: each popular signal is scored against that truth under rules fixed in advance.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.fu{animation:fu .9s cubic-bezier(.22,1,.36,1) both}.fi{animation:fi .9s ease-out both}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fi{from{opacity:0}to{opacity:1}}.flow{opacity:0;animation:flow 2.1s cubic-bezier(.45,0,.55,1) 2 both}@keyframes flow{0%{transform:translateX(0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translateX(206px);opacity:0}}.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="449" rx="24" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><g class="fi d1"><rect x="292" y="142" width="216" height="1.5" fill="#c3c2b7"/><circle cx="292" cy="142.75" r="4" fill="#2a78d6" class="flow" style="animation-delay:0.00s"/><circle cx="2