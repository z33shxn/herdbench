<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Sealed before any result existed</title><desc id="desc">Timeline. 17 November 2026, 22:07 UTC: the plan is anchored in Bitcoin block 976,330. 5 days 16 hours later, on 23 November 2026 at 14:51 UTC, the frozen scoring code is run against the truth for the first time. The results are then published, every file hashed.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.fu{animation:fu .9s cubic-bezier(.22,1,.36,1) both}.fi{animation:fi .9s ease-out both}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fi{from{opacity:0}to{opacity:1}}.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.draw{transform-box:fill-box;transform-origin:left center;animation:grow 2.2s cubic-bezier(.65,0,.35,1) .2s both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="359" rx="24" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><rect x="210" y="131" width="780" height="2" fill="#2c2c2a"/><rect class="draw" x="210" y="131" width="780" height="2" fill="#3987e5"/><g class="pop d2" style="transform-origin:210px 132px"><circle cx="210" cy="132" r="22" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/><circle cx="210" cy="132" r="15" fill="#3987e5"/><path d="M204 129v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#fff" stroke-width="2.2"/><rect x="201" y="129" width="18" height="13" rx="3" fill="#fff"/><circle cx="210" cy="135.5" r="2" fill="#3987e5"/></g><text x="210" y="86" font-size="13" fill="#898781" font-weight="700" text-anchor="middle" letter-spacing="1.4" class="fu d2">17 NOV 2026, 22:07 UTC</text><text x="210" y="194" font-size="21" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="-0.2" class="fu d3">Plan sealed in Bitcoin</text><text x="210" y="226" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d4">Every test, threshold and verdict rule</text><text x="210" y="250" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d4">written down, then anchored in</text><text x="210" y="274" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d4">block 976,330.</text><g class="pop d6" style="transform-origin:600px 132px"><circle cx="600" cy="132" r="22" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/><circle cx="600" cy="132" r="15" fill="#3987e5"/><circle cx="598" cy="130" r="6" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M602.5 134.5l4.5 4.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g><text x="600" y="86" font-size="13" fill="#898781" font-weight="700" text-anchor="middle" letter-spacing="1.4" class="fu d6">23 NOV 2026, 14:51 UTC</text><text x="600" y="194" font-size="21" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="-0.2" class="fu d7">First look at the truth</text><text x="600" y="226" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d8">The scoring code is frozen, then</text><text x="600" y="250" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d8">compared with what traders really held</text><text x="600" y="274" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d8">for the first time.</text><g class="pop d10" style="transform-origin:990px 132px"><circle cx="990" cy="132" r="22" fill="#1a1a19" stroke="#0ca30c" stroke-width="2"/><circle cx="990" cy="132" r="15" fill="#0ca30c"/><path d="M984 132.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="990" y="86" font-size="13" fill="#898781" font-weight="700" text-anchor="middle" letter-spacing="1.4" class="fu d10">23 NOV 2026, 15:38 UTC</text><text x="990" y="194" font-size="21" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="-0.2" class="fu d11">Results published</text><text x="990" y="226" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d12">Every table and figure released, each</text><text x="990" y="250" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d12">file hashed and rebuildable from</text><text x="990" y="274" font-size="16" fill="#c3c2b7" text-anchor="middle" class="fu d12">public data.</text><g class="fi d4"><rect x="313.2" y="116" width="183.6" height="32" rx="16" fill="#1a1a19" stroke="#2c2c2a"/><text x="405" y="137" font-size="14" fill="#c3c2b7" font-weight="650" text-anchor="middle">5 days 16 hours later</text></g></svg>
