<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="858" viewBox="0 0 1200 858" role="img" aria-labelledby="title desc"><title id="title">Which signals really know what the crowd holds?</title><desc id="desc">Scorecard. Price premium: correlation 0.29 (95% range 0.22 to 0.40), tracks the crowd. Price momentum: correlation 0.14 (95% range 0.07 to 0.21), tracks the crowd. Binance, top traders' positions: correlation 0.09 (95% range 0.00 to 0.17), too close to call. Binance, top traders' accounts: correlation 0.06 (95% range -0.03 to 0.16), too close to call. Binance, all accounts: correlation 0.03 (95% range -0.07 to 0.14), too close to call. Binance, taker flow: correlation 0.03 (95% range 0.00 to 0.06), no useful link. Open interest flow: correlation -0.02 (95% range -0.07 to 0.03), no useful link.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.fu{animation:fu .9s cubic-bezier(.22,1,.36,1) both}.fi{animation:fi .9s ease-out both}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fi{from{opacity:0}to{opacity:1}}.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.grow{transform-box:fill-box;animation:grow 1s cubic-bezier(.22,1,.36,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="857" rx="24" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="56" y="76" font-size="32" fill="#0b0b0b" font-weight="750" letter-spacing="-0.6" class="fu d1">Which signals really know what the crowd holds?</text><text x="56" y="112" font-size="18" fill="#52514e" class="fu d2">How closely each signal follows what traders really held, measured inside each market over 297 days and averaged across 30</text><text x="56" y="138" font-size="18" fill="#52514e" class="fu d2">markets. A thin line marks the 95% range.</text><g class="fi d2"><rect x="542.3" y="182" width="137.3" height="524" rx="8" fill="#f4f3ef"/><rect x="542.3" y="182" width="1" height="524" fill="#e1e0d9" fill-opacity="0.7"/><text x="542.333" y="732" font-size="14" fill="#898781" text-anchor="middle">-0.1</text><text x="611" y="732" font-size="14" fill="#898781" text-anchor="middle">0.0</text><rect x="679.7" y="182" width="1" height="524" fill="#e1e0d9" fill-opacity="0.7"/><text x="679.667" y="732" font-size="14" fill="#898781" text-anchor="middle">0.1</text><rect x="748.3" y="182" width="1" height="524" fill="#e1e0d9" fill-opacity="0.7"/><text x="748.333" y="732" font-size="14" fill="#898781" text-anchor="middle">0.2</text><rect x="817.0" y="182" width="1" height="524" fill="#e1e0d9" fill-opacity="0.7"/><text x="817" y="732" font-size="14" fill="#898781" text-anchor="middle">0.3</text><rect x="885.7" y="182" width="1" height="524" fill="#e1e0d9" fill-opacity="0.7"/><text x="885.667" y="732" font-size="14" fill="#898781" text-anchor="middle">0.4</text><rect x="610.2" y="182" width="1.5" height="524" fill="#c3c2b7"/><text x="611" y="170" font-size="14" fill="#898781" text-anchor="middle">Too small to matter</text><text x="817" y="170" font-size="14" fill="#898781" text-anchor="middle">Tracks the crowd →</text></g><text x="56" y="219" font-size="19" fill="#0b0b0b" font-weight="650" class="fu d3">Price premium</text><text x="56" y="243" font-size="15" fill="#898781" class="fu d3">How far the futures price sat above spot, last 24 hours</text><path class="grow d5" style="transform-origin:left center" fill="#2a78d6" d="M611.0 214.0h198.4a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-198.4z"/><g class="fi d9" fill="#52514e"><rect x="764.4" y="221" width="122.5" height="2" rx="1"/><rect x="763.4" y="215" width="2" height="14" rx="1"/><rect x="885.9" y="215" width="2" height="14" rx="1"/></g><text x="898.881" y="227" font-size="16" fill="#0b0b0b" font-weight="650" class="fi d9" font-variant-numeric="tabular-nums">0.29</text><g class="fu d10"><rect x="956" y="205" width="175" height="34" rx="17" fill="#0ca30c" fill-opacity="0.13"/><circle cx="975" cy="222" r="10" fill="#0ca30c"/><path d="M970.8 222.1l3.2 3.4 5.5 -6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="992" y="227.5" font-size="15" fill="#0b0b0b" font-weight="650">Tracks the crowd</text></g><rect x="56" y="259" width="1088" height="1" fill="#e1e0d9" fill-opacity="0.6"/><text x="56" y="293" font-size="19" fill="#0b0b0b" font-weight="650" class="fu d4">Price momentum</text><text x="56" y="317" font-size="15" fill="#898781" class="fu d4">The price change over the last 7 days</text><path class="grow d6" style="transform-origin:left center" fill="#2a78d6" d="M611.0 288.0h89.6a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-89.6z"/><g class="fi d10" fill="#52514e"><rect x="661.5" y="295" width="94.5" height="2" rx="1"/><rect x="660.5" y="289" width="2" height="14" rx="1"/><rect x="755.0" y="289" width="2" height="14" rx="1"/></g><text x="767.969" y="301" font-size="16" fill="#0b0b0b" font-weight="650" class="fi d10" font-variant-numeric="tabular-nums">0.14</text><g class="fu d11"><rect x="956" y="279" width="175" height="34" rx="17" fill="#0ca30c" fill-opacity="0.13"/><circle cx="975" cy="296" r="10" fill="#0ca30c"/><path d="M970.8 296.1l3.2 3.4 5.5 -6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="9